<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>PunchPunchPunch</title>
    <style>
      /* touch-action: none stops the browser from claiming drags for scroll/zoom — */
      /* essential, or the virtual joystick + camera drag fight the page. */
      html, body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      canvas { display: block; touch-action: none; }
    </style>
  </head>
  <body>
    <script>
      // TEMP on-screen error painter: any uncaught error shows as red text instead of a
      // silent black screen (phones have no visible console). Remove once mobile is stable.
      function showError(msg) {
        const d = document.createElement("div");
        d.style.cssText =
          "position:fixed;inset:0;z-index:9999;background:#200;color:#f88;" +
          "font:12px monospace;padding:14px;white-space:pre-wrap;overflow:auto;";
        d.textContent = "ERROR:\n" + msg;
        document.body.appendChild(d);
      }
      // Ignore Vite's own HMR/websocket noise — only surface real game crashes.
      const isNoise = (s) => /vite|websocket/i.test(String(s || ""));
      window.addEventListener("error", (e) => {
        if (isNoise(e.filename) || isNoise(e.message)) return;
        showError((e.message || e.error) + "\n\n" + ((e.error && e.error.stack) || "") + "\n" + (e.filename || "") + ":" + (e.lineno || ""));
      });
      window.addEventListener("unhandledrejection", (e) => {
        const r = e.reason && (e.reason.stack || e.reason.message || e.reason);
        if (isNoise(r)) return;
        showError("Promise rejection:\n" + r);
      });
    </script>
    <script>
      // TEMP mobile debug console: open the page with ?debug to get an on-screen console
      // (phones have no DevTools). Tap the floating gear → Console tab to read errors.
      // Remove this block once mobile is sorted.
      if (location.search.includes("debug")) {
        const s = document.createElement("script");
        s.src = "https://cdn.jsdelivr.net/npm/eruda";
        s.onload = () => window.eruda && window.eruda.init();
        document.head.appendChild(s);
      }
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
