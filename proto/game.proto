syntax = "proto3";

package punch.v1;

option go_package = "punchpunchpunch/server/gen/gamepb;gamepb";

// A point or direction in world space. double, not float, because the sim runs in float64 on both
// sides and reconciliation replays through these positions, so the low bits have to survive the wire.
message Vec3 {
  double x = 1;
  double y = 2;
  double z = 3;
}

// One tick of intent from a client. dir is already world space and its length is the speed, so walk
// versus run rides in the same three numbers. seq counts ticks up forever, and the server echoes the
// last one it processed back in Snapshot.ack.
message Input {
  uint32 seq = 1;
  Vec3 dir = 2;
}

// One player as the snapshot sees them. Name and character model are NOT here: they never change while
// connected, so they ride the join and roster messages instead of thirty times a second forever.
message PlayerSnapshot {
  string id = 1;
  uint32 planet_id = 2;
  Vec3 position = 3;
  Vec3 forward = 4;
  string anim = 5;
}

// The whole world at one server tick. ack is the last input seq the server processed for the client
// receiving this snapshot, which is how that client knows which predicted inputs still need replaying.
message Snapshot {
  uint32 tick = 1;
  uint32 ack = 2;
  repeated PlayerSnapshot players = 3;
}

// A clock probe. client_time is the sender's own timestamp in milliseconds, echoed back in the Pong so
// the client can measure the round trip and line its clock up with the server's.
message Ping {
  double client_time = 1;
}

// The reply to a Ping. It carries back the client's own timestamp and the server's current tick, which
// together let the client estimate how far ahead the server's clock is and render remotes in its past.
message Pong {
  double client_time = 1;
  uint32 server_tick = 2;
}

// One step of the handshake two browsers go through before they can send each other sound. The server
// never looks inside: it reads peer, forwards the message to that player, and writes the sender's id
// into peer on the way back out.
//
// So peer always means "the player at the other end of this exchange", whichever direction you are
// holding it. Going up it is who the message is for; coming down it is who it came from. There is
// deliberately no sender field on the way up, because the server already knows who sent it from the
// socket it arrived on, and a client-supplied sender would just be a way to impersonate someone.
message VoiceSignal {
  // Which step of the handshake this is. Only the client cares; the server forwards all three the same.
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_OFFER = 1; // "here is the sound I can send you, and how to reach me"
    KIND_ANSWER = 2; // the reply that completes the pair
    KIND_CANDIDATE = 3; // one address this browser might be reachable at, sent as each one is found
  }
  string peer = 1;
  Kind kind = 2;
  // Whatever the browser produced for this step, carried through untouched. Offers and answers hold an
  // audio description, a candidate holds one address. Opaque on purpose: the wire never has to know or
  // care what browsers put in them, which is also why this stays a string rather than a parsed shape.
  string payload = 3;
}

// Everything a client can send. A oneof, so a new kind of message becomes a new variant instead of a
// reshaped socket.
message ClientMessage {
  oneof body {
    Input input = 1;
    Ping ping = 2;
    VoiceSignal voice = 3;
  }
}

// Who a player is, the parts that do not change while they are connected: their id, which planet they are
// on, which of the character pool they wear, and the name over their head. Character and name ride here,
// sent once on join, rather than in every snapshot thirty times a second forever.
message PlayerInfo {
  string id = 1;
  uint32 planet_id = 2;
  string character = 3; // a key into the client's model catalog, e.g. "wizard"
  string name = 4;      // the display name floated over the head
}

// Sent to a player the moment they join. you is their own id, character and name, so they can tell
// themselves apart in snapshots and wear the character the server picked for them; players is the roster
// of everyone already here.
message Welcome {
  PlayerInfo you = 1;
  repeated PlayerInfo players = 2;
}

// Sent to everyone else when a player joins.
message Join {
  PlayerInfo player = 1;
}

// Sent to everyone when a player leaves, so their avatar can be removed.
message Leave {
  string id = 1;
}

// Everything the server can send. The oneof means a new kind of message is a new variant here, and old
// clients ignore variants they do not know rather than breaking on them.
message ServerMessage {
  oneof body {
    Snapshot snapshot = 1;
    Welcome welcome = 2;
    Join join = 3;
    Leave leave = 4;
    Pong pong = 5;
    VoiceSignal voice = 6;
  }
}
